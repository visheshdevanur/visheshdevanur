<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Vishesh G Devanur — Creative Developer</title>
<desc id="desc">Obsidian-black cinematic hero with dimensional chrome typography and electric-blue light trails.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07090f"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#167dff" stop-opacity=".42"/><stop offset="1" stop-color="#167dff" stop-opacity="0"/></radialGradient>
