<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Line Formation Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.4; }
      }
      
      @keyframes glowShift {
        0%, 100% { opacity: 0.8; transform: translate(0, 0); }
        50% { opacity: 1; transform: translate(15px, -10px); }
      }

      /* Multi-line typewriter effect using opacity keyframes */
      .type-line-1 { animation: cycleText1 16s infinite; }
      .type-line-2 { animation: cycleText2 16s infinite; }
      .type-line-3 { animation: cycleText3 16s infinite; }
      .type-line-4 { animation: cycleText4 16s infinite; }

      @keyframes cycleText1 {
        0%, 20% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleText2 {
        0%, 22% { opacity: 0; transform: translateY(8px); }
        25%, 45% { opacity: 1; transform: translateY(0); }
        50%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleText3 {
        0%, 47% { opacity: 0; transform: translateY(8px); }
        50%, 70% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleText4 {
        0%, 72% { opacity: 0; transform: translateY(8px); }
        75%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-8px); }
      }

      .pulse-circle {
        transform-origin: 50px 48px;
        animation: pulseDot 2s infinite ease-in-out;
      }

      .ambient-glow {
        animation: glowShift 8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Card Background with 1px border -->
  <rect x="1" y="1" width="898" height="338" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid -->
  <rect x="2" y="2" width="896" height="336" rx="17" fill="url(#grid)"/>

  <!-- Radial Blue Glow Ambient Center -->
  <circle cx="450" cy="150" r="320" fill="url(#blueGlow)" class="ambient-glow"/>

  <!-- Geometric Decorative Lines (Echoing VGDLineFormation in portfolio) -->
  <g opacity="0.35">
    <line x1="40" y1="40" x2="200" y2="40" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="40" y1="40" x2="40" y2="120" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="40" cy="40" r="3" fill="#3B82F6"/>
    
    <line x1="860" y1="40" x2="700" y2="40" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="860" y1="40" x2="860" y2="120" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="860" cy="40" r="3" fill="#3B82F6"/>

    <line x1="40" y1="300" x2="160" y2="300" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="860" y1="300" x2="740" y2="300" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="410" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#10B981"/>
    <circle cx="16" cy="13" r="8" fill="#10B981" opacity="0.3" class="pulse-circle"/>
    <text x="32" y="17" fill="#94A3B8" font-size="11" font-weight="600" class="font-mono">
      COO @ <tspan fill="#F8FAFC" font-weight="700">YVB&amp;CO</tspan> &bull; Available for select advisory
    </text>
  </g>

  <!-- Top Right Terminal Tag -->
  <g transform="translate(680, 36)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="17" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">
      [ vgd.terminal ]
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(48, 142)">
    <text x="0" y="0" fill="#3B82F6" font-size="12" font-weight="800" letter-spacing="3.5" text-transform="uppercase" class="font-mono">
      DIGITAL IDENTITY // PORTFOLIO
    </text>
    <text x="0" y="48" fill="url(#titleGrad)" font-size="52" font-weight="900" letter-spacing="-1.5" class="font-sans">
      VISHESH G DEVANUR
    </text>
  </g>

  <!-- Animated Role Typewriter Text Stream -->
  <g transform="translate(48, 230)">
    <text x="0" y="0" fill="#38BDF8" font-size="16" font-weight="700" class="font-mono">&gt;</text>
    <g transform="translate(20, 0)">
      <text x="0" y="0" fill="#E2E8F0" font-size="16" font-weight="600" class="font-mono type-line-1">
        Chief Operating Officer @ YVB&amp;Co <tspan fill="#64748B">|</tspan> <tspan fill="#38BDF8">Software Studio</tspan>
      </text>
      <text x="0" y="0" fill="#E2E8F0" font-size="16" font-weight="600" class="font-mono type-line-2">
        Full-Stack Engineer &amp; ERP Architect <tspan fill="#64748B">|</tspan> <tspan fill="#38BDF8">Enterprise Platforms</tspan>
      </text>
      <text x="0" y="0" fill="#E2E8F0" font-size="16" font-weight="600" class="font-mono type-line-3">
        Offline Edge AI &amp; SLM Systems <tspan fill="#64748B">|</tspan> <tspan fill="#38BDF8">Whisper &bull; Local LLMs</tspan>
      </text>
      <text x="0" y="0" fill="#E2E8F0" font-size="16" font-weight="600" class="font-mono type-line-4">
        Building Systems That Solve Real-World Problems <tspan fill="#38BDF8">&bull;</tspan> 9.55 CGPA
      </text>
    </g>
  </g>

  <!-- Bottom Accent Strip with Portfolio URL & Tech Badges -->
  <line x1="48" y1="264" x2="852" y2="264" stroke="#1E293B" stroke-width="1"/>

  <g transform="translate(48, 296)">
    <rect x="0" y="-14" width="220" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="3" fill="#94A3B8" font-size="11" font-weight="500" class="font-mono">
      &bull; <tspan fill="#38BDF8" font-weight="600">visheshgdevanur.vercel.app</tspan>
    </text>

    <g transform="translate(490, 0)">
      <text x="0" y="3" fill="#64748B" font-size="10.5" font-weight="600" class="font-mono">
        NEXT.JS &bull; TYPESCRIPT &bull; POSTGRES &bull; EDGE AI &bull; ERP
      </text>
    </g>
  </g>

  <line x1="300" y1="339" x2="600" y2="339" stroke="url(#lineGrad)" stroke-width="2"/>
</svg>